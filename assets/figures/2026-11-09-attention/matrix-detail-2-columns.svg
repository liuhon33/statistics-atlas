<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="900" viewBox="0 0 1100 900" role="img" aria-labelledby="title desc">
<title id="title">2 · MATRIX × COLUMN → ONE OUTPUT COLUMN</title><desc id="desc">Dashed outlines group complete column vectors. Compute Ab1 and Ab2 separately and place them side by side, without adding the output columns.</desc>
<rect width="1100" height="100%" rx="18" fill="white"/>
<text x="36" y="48" fill="#243447" font-family="Segoe UI, Arial, sans-serif" font-size="29" font-weight="700" text-anchor="start">2 · MATRIX × COLUMN → ONE OUTPUT COLUMN</text>
<text x="36" y="88" fill="#245eb2" font-family="Segoe UI, Arial, sans-serif" font-size="28" font-weight="600" text-anchor="start">B = [ b₁ | b₂ ]     ⇒     AB = [ Ab₁ | Ab₂ ]</text>
<text x="36" y="125" fill="#526279" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="400" text-anchor="start">Dashed outlines mean “keep this whole column together.”</text>
