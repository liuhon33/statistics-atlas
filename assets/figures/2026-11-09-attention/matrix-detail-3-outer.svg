<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="1100" viewBox="0 0 1100 1100" role="img" aria-labelledby="title desc">
<title id="title">3 · COLUMN × ROW → ONE WHOLE MATRIX</title><desc id="desc">Take column k of A and row k of B. Form their outer product, repeat for k equals 1, 2, 3, and add the three 2 by 2 matrices entry by entry.</desc>
<rect width="1100" height="100%" rx="18" fill="white"/>
<text x="36" y="48" fill="#243447" font-family="Segoe UI, Arial, sans-serif" font-size="29" font-weight="700" text-anchor="start">3 · COLUMN × ROW → ONE WHOLE MATRIX</text>
<text x="36" y="88" fill="#ad5710" font-family="Segoe UI, Arial, sans-serif" font-size="27" font-weight="600" text-anchor="start">AB = A[:,1] B[1,:] + A[:,2] B[2,:] + A[:,3] B[3,:]</text>
<text x="36" y="125" fill="#526279" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="400" text-anchor="start">Match the same inner index k: column k of A with row k of B.</text>
