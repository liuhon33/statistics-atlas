   <g id="text_21">
    <!-- $A:2\times3,\ B:3\times2,\ AB:2\times2$ -->
    <g style="fill: #243447" transform="translate(550.8 83.95125)">
     <text>
      <tspan style="font: oblique 12px 'DejaVu Sans'" x="0 56.976524 113.976485 122.185469" y="-0.09375">ABAB</tspan>
      <tspan style="font: 12px 'DejaVu Sans'" x="10.546875 16.927734 26.900391 39.292969 46.927734 67.546836 73.927695 83.900352 96.29293 103.927695 132.755781 139.136641 149.109297 161.501875" y="-0.09375">:2×3,:3×2,:2×2</tspan>
