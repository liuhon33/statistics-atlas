    <g style="fill: #243447" transform="translate(309.6 311.756406)">
     <text>
      <tspan style="font: oblique 13px 'DejaVu Sans'" x="0 8.893066 47.519189 93.398145 139.2771" y="-0.38437500000000036">AbAAA</tspan>
