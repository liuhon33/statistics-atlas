   <g id="text_22">
    <text style="fill: #3568aa; font: 700 13px 'DejaVu Sans'; text-anchor: start" x="28.8" y="169.187188" transform="rotate(-0 28.8 169.187188)">1  ROW x COLUMN</text>
   </g>
   <g id="text_23">
    <!-- $(AB)_{ij}=\sum_k A_{ik}B_{kj}$ -->
    <g style="fill: #243447" transform="translate(309.6 165.77)">
     <text>
      <tspan style="font: 17px 'DejaVu Sans'" x="0 29.924316 47.108594" y="-0.703125">()=</tspan>
      <tspan style="font: oblique 17px 'DejaVu Sans'" x="6.632324 18.261719 80.086621 102.378369" y="-0.703125">ABAB</tspan>
      <tspan style="font: oblique 11.9px 'DejaVu Sans'" x="36.719336 40.025537 68.664746 91.716016 95.022217 114.040967 120.932275" y="2.0859375 2.0859375 16.1390625 2.0859375 2.0859375 2.0859375 2.0859375">ijkikkj</tspan>
      <tspan style="font: 17px 'DejaVu Sans Display'" x="64.664746" y="-0.703125">∑</tspan>
     </text>
    </g>
   </g>
   <g id="text_24">
