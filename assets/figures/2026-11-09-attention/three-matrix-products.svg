      <tspan style="font: 13px 'DejaVu Sans'" x="25.8229 39.248193 71.701855 85.127148 117.580811 131.006104 163.459766 176.885059 181.956836 190.227832 196.892871 205.163867" y="-0.38437500000000036">=2+1+0=(4,1)</tspan>
     </text>
    </g>
   </g>
