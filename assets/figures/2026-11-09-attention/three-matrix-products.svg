      <tspan style="font: 17px 'DejaVu Sans'" x="26.604004 44.160156 122.745202" y="-0.078125">=[]</tspan>
      <tspan style="font: 11.9px 'DejaVu Sans'" x="73.212891 114.709216" y="2.7109375">12</tspan>
     </text>
    </g>
   </g>
