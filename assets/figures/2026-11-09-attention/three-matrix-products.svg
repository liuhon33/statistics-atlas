     <text>
      <tspan style="font: 13px 'DejaVu Sans'" x="0 22.883301 42.54707 55.972363 64.243359 69.315137 77.586133 85.190625 98.615918 106.886914 111.958691 120.229687 127.83418 141.259473 149.530469 154.602246 162.873242 170.477734 183.903027" y="-0.140625">()=1(1)+2(0)+0(2)=1</tspan>
      <tspan style="font: oblique 13px 'DejaVu Sans'" x="5.071777 13.964844" y="-0.140625">AB</tspan>
      <tspan style="font: 9.1px 'DejaVu Sans'" x="28.079492 33.869189" y="1.9921875">12</tspan>
     </text>
    </g>
   </g>
