   <g id="text_1">
    <text style="fill: #26364a; font: 700 17px 'DejaVu Sans'; text-anchor: start" x="18.112" y="20.73" transform="rotate(-0 18.112 20.73)">Two routes to a trainable noise predictor</text>
   </g>
   <g id="text_2">
    <text style="fill: #2969a7; font: 700 11px 'DejaVu Sans'; text-anchor: middle" x="89.04" y="70.092032" transform="rotate(-0 89.04 70.092032)">Likelihood / ELBO</text>
   </g>
   <g id="text_3">
    <text style="fill: #26364a; font: 10px 'DejaVu Sans'; text-anchor: middle" x="89.04" y="87.838055" transform="rotate(-0 89.04 87.838055)">compare reverse Gaussians</text>
   </g>
   <g id="text_4">
    <text style="fill: #2969a7; font: 700 11px 'DejaVu Sans'; text-anchor: middle" x="255.448" y="70.092032" transform="rotate(-0 255.448 70.092032)">Mean prediction</text>
   </g>
   <g id="text_5">
    <!-- $\|\widetilde{\mu}_t-\mu_\theta\|^2$ -->
    <g style="fill: #26364a" transform="translate(231.698 88.42868)">
     <text>
      <tspan style="font: 10px 'DejaVu Sans'" x="0 16.424316 37.669922" y="-0.9765625">‖−‖</tspan>
      <tspan style="font: 6.504593px 'STIXSizeTwoSym'" x="13.074951" y="-3.7421875">̃</tspan>
      <tspan style="font: oblique 10px 'DejaVu Sans'" x="5 26.751465" y="-0.9765625">μμ</tspan>
      <tspan style="font: oblique 7px 'DejaVu Sans'" x="11.458008 33.11377" y="0.6640625">tθ</tspan>
      <tspan style="font: 7px 'DejaVu Sans'" x="42.765625" y="-4.8046875">2</tspan>
     </text>
    </g>
   </g>
   <g id="text_6">
    <text style="fill: #2969a7; font: 700 11px 'DejaVu Sans'; text-anchor: middle" x="425.948" y="70.092032" transform="rotate(-0 425.948 70.092032)">Reparameterize</text>
   </g>
   <g id="text_7">
    <!-- $\mu_\theta=A_tx_t-B_t\epsilon_\theta$ -->
    <g style="fill: #26364a" transform="translate(388.848 87.817742)">
     <text>
      <tspan style="font: oblique 10px 'DejaVu Sans'" x="0 23.193848 33.052734 54.26416 64.142578" y="-0.703125">μAxBε</tspan>
      <tspan style="font: oblique 7px 'DejaVu Sans'" x="6.362305 30.034668 38.970703 61.124512 69.547852" y="0.9375">θtttθ</tspan>
      <tspan style="font: 10px 'DejaVu Sans'" x="12.866699 43.937012" y="-0.703125">=−</tspan>
     </text>
    </g>
   </g>
   <g id="text_8">
    <text style="fill: #138d82; font: 700 11px 'DejaVu Sans'; text-anchor: middle" x="89.04" y="156.641064" transform="rotate(-0 89.04 156.641064)">Score matching</text>
   </g>
   <g id="text_9">
    <!-- $s_t=\nabla\log p_t$ -->
    <g style="fill: #26364a" transform="translate(62.29 174.42068)">
     <text>
      <tspan style="font: oblique 10px 'DejaVu Sans'" x="0 44.060579" y="-0.40625">sp</tspan>
      <tspan style="font: oblique 7px 'DejaVu Sans'" x="5.209961 50.408236" y="1.234375">tt</tspan>
      <tspan style="font: 10px 'DejaVu Sans'" x="10.17627 20.503418 27.192871 29.971191 36.089355" y="-0.40625">=∇log</tspan>
     </text>
    </g>
   </g>
   <g id="text_10">
    <text style="fill: #138d82; font: 700 11px 'DejaVu Sans'; text-anchor: middle" x="255.448" y="156.684033" transform="rotate(-0 255.448 156.684033)">Gaussian teacher</text>
   </g>
   <g id="text_11">
    <!-- $\nabla\log q_t=-\epsilon/b_t$ -->
    <g style="fill: #26364a" transform="translate(217.598 174.42068)">
     <text>
      <tspan style="font: 10px 'DejaVu Sans'" x="0 6.689453 9.467773 15.585938 34.871126 47.146517 62.878939" y="-0.40625">∇log=−/</tspan>
      <tspan style="font: oblique 10px 'DejaVu Sans'" x="23.557161 57.473665 66.248079" y="-0.40625">qεb</tspan>
      <tspan style="font: oblique 7px 'DejaVu Sans'" x="29.904818 72.595736" y="1.234375">tt</tspan>
     </text>
    </g>
   </g>
   <g id="text_12">
    <text style="fill: #138d82; font: 700 11px 'DejaVu Sans'; text-anchor: middle" x="425.948" y="156.684033" transform="rotate(-0 425.948 156.684033)">Reparameterize</text>
   </g>
   <g id="text_13">
    <!-- $s_\theta=-\epsilon_\theta/b_t$ -->
    <g style="fill: #26364a" transform="translate(397.398 174.430055)">
     <text>
      <tspan style="font: oblique 10px 'DejaVu Sans'" x="0 34.316895 47.647461" y="-0.40625">sεb</tspan>
      <tspan style="font: oblique 7px 'DejaVu Sans'" x="5.209961 39.722168 53.995117" y="1.234375">θθt</tspan>
      <tspan style="font: 10px 'DejaVu Sans'" x="11.714355 23.989746 44.27832" y="-0.40625">=−/</tspan>
     </text>
    </g>
   </g>
   <g id="text_14">
    <text style="fill: #8c61ae; font: 700 11px 'DejaVu Sans'; text-anchor: middle" x="637.368" y="110.736153" transform="rotate(-0 637.368 110.736153)">Noise MSE</text>
   </g>
   <g id="text_15">
    <!-- $\mathbb{E}\|\epsilon-\epsilon_\theta(x_t,t)\|^2$ -->
    <g style="fill: #26364a" transform="translate(600.018 132.07646)">
     <text>
      <tspan style="font: italic 10px 'STIXNonUnicode'" x="0" y="-0.9765625"></tspan>
      <tspan style="font: 10px 'DejaVu Sans'" x="6.389984 18.7435 39.032074 51.869476 60.917328 64.818695" y="-0.9765625">‖−(,)‖</tspan>
      <tspan style="font: oblique 10px 'DejaVu Sans'" x="11.389984 29.070648 42.933441 56.996429" y="-0.9765625">εεxt</tspan>
      <tspan style="font: oblique 7px 'DejaVu Sans'" x="34.475922 48.85141" y="0.6640625">θt</tspan>
      <tspan style="font: 7px 'DejaVu Sans'" x="69.914398" y="-4.8046875">2</tspan>
     </text>
    </g>
   </g>
   <g id="text_16">
    <text style="fill: #26364a; font: 11px 'DejaVu Sans'; text-anchor: start" x="23.568" y="219.3504" transform="rotate(-0 23.568 219.3504)">Same regression target; timestep weights must be accounted for separately.</text>
   </g>
  </g>
