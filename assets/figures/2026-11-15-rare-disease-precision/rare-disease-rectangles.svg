  <g id="text_9">
   <text style="fill: #162b40; font: 700 23px 'DejaVu Sans'; text-anchor: start" x="37.44" y="30.24" transform="rotate(-0 37.44 30.24)">99% ACCURACY DOES NOT MEAN 99% PRECISION</text>
  </g>
  <g id="text_10">
   <text style="fill: #566778; font: 13px 'DejaVu Sans'; text-anchor: start" x="37.44" y="55.44" transform="rotate(-0 37.44 55.44)">Hypothetical population: 1% disease  |  Sensitivity 99%  |  Specificity 99%</text>
  </g>
  <g id="text_11">
   <text style="fill: #162b40; font: 700 16px 'DejaVu Sans'; text-anchor: start" x="37.44" y="95.76" transform="rotate(-0 37.44 95.76)">1  Whole population: 10,000 people</text>
  </g>
  <g id="text_12">
   <text style="fill: #162b40; font: 700 16px 'DejaVu Sans'; text-anchor: start" x="552.24" y="95.76" transform="rotate(-0 552.24 95.76)">2  Keep only positive tests</text>
  </g>
  <g id="text_13">
   <text style="fill: #162b40; font: 12px 'DejaVu Sans'; text-anchor: start" x="552.24" y="146.16" transform="rotate(-0 552.24 146.16)">Discard the blue and orange regions.</text>
  </g>
  <g id="text_14">
   <text style="fill: #162b40; font: 12px 'DejaVu Sans'; text-anchor: start" x="552.24" y="171.36" transform="rotate(-0 552.24 171.36)">Green + red = 99 + 99 = 198 positives.</text>
  </g>
  <g id="text_15">
   <text style="fill: #566778; font: 11px 'DejaVu Sans'; text-anchor: start" x="552.24" y="302.4" transform="rotate(-0 552.24 302.4)">New denominator: all 198 positive tests = 100%</text>
  </g>
  <g id="text_16">
   <text style="fill: #168575; font: 700 17px 'DejaVu Sans'; text-anchor: start" x="552.24" y="342.72" transform="rotate(-0 552.24 342.72)">PRECISION = 99 / 198 = 50%</text>
  </g>
  <g id="text_17">
   <text style="fill: #162b40; font: 700 13px 'DejaVu Sans'; text-anchor: start" x="37.44" y="388.08" transform="rotate(-0 37.44 388.08)">Width × retained height = joint probability area</text>
  </g>
  <g id="text_18">
   <text style="fill: #168575; font: 700 13px 'DejaVu Sans'; text-anchor: start" x="37.44" y="418.32" transform="rotate(-0 37.44 418.32)">Green: 0.01 × 0.99 = 0.0099</text>
  </g>
  <g id="text_19">
   <text style="fill: #cc4455; font: 700 13px 'DejaVu Sans'; text-anchor: start" x="496.08" y="418.32" transform="rotate(-0 496.08 418.32)">Red: 0.99 × 0.01 = 0.0099</text>
  </g>
  <g id="text_20">
   <text style="fill: #162b40; font: 700 16px 'DejaVu Sans'; text-anchor: start" x="37.44" y="453.6" transform="rotate(-0 37.44 453.6)">Bayes: posterior = green area / (green area + red area)</text>
  </g>
  <g id="text_21">
   <text style="fill: #566778; font: 11px 'DejaVu Sans'; text-anchor: start" x="37.44" y="481.32" transform="rotate(-0 37.44 481.32)">Left areas are to probability scale. Right bar is renormalized: the retained 1.98% becomes 100%.</text>
  </g>
